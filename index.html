<!DOCTYPE html>
<!-- Diceball: an offline, turn-based baseball dice game. An original game; not affiliated with any league, team or publisher. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F3EFE3">
<script>try{var t=localStorage.getItem('dd.theme')==='dark'?'dark':'light';document.documentElement.dataset.theme=t;if(t==='dark')document.querySelector('meta[name=theme-color]').content='#0E1A13'}catch(e){document.documentElement.dataset.theme='light'}</script>
<meta name="description" content="A turn-based baseball dice game for two teams on one screen. Works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diceball">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Diceball: a baseball dice game</title>
<style>
:root{
  --paper:#F3EFE3; --sheet:#FBF9F2; --ink:#17261D; --muted:#5A6B5F;
  --line:#1F5E3B; --line-soft:rgba(31,94,59,.22);
  --vis:#1C4E8A; --home:#C8402B; --roll:#0F7A5C; --good:#0F7A5C; --bad:#C8531F;
  --cond:"Bahnschrift SemiCondensed","Bahnschrift","Avenir Next Condensed","DIN Condensed","DIN Alternate","Roboto Condensed","Arial Narrow",sans-serif-condensed,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0E1A13; --sheet:#15261C; --ink:#EEF4EC; --muted:#A5B8A9;
  --line:#9FD3B0; --line-soft:rgba(159,211,176,.25);
  --vis:#6FA8E8; --home:#FF7A63; --roll:#1FA37C; --good:#4CCB9B; --bad:#FF9A5C;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit}
.btn{font-family:var(--cond);font-stretch:condensed;font-size:1rem;padding:.58em 1.05em;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer;line-height:1.1;font-weight:600}
.btn:hover:not(:disabled){background:var(--line-soft)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{font-size:.9rem;padding:.4em .7em}
.btn.primary{background:var(--roll);border-color:var(--roll);color:#fff;font-weight:700}
.btn.primary:hover:not(:disabled){background:var(--roll);filter:brightness(1.1)}
.btn.danger{background:var(--home);border-color:var(--home);color:#fff}
.btn[aria-pressed=true]{background:var(--line);color:var(--sheet)}
.btn.ghost{border-color:transparent}
#app{max-width:560px;margin:0 auto;padding:8px 10px 18px;display:flex;flex-direction:column;gap:10px}
#app[hidden]{display:none}
.bar{display:flex;align-items:center;gap:6px}
.bar h1{font-family:var(--cond);font-stretch:condensed;font-size:1.5rem;margin:0;flex:1;letter-spacing:.01em}
.bar .btn{min-width:42px;min-height:40px}
.bar .btn svg{width:1.15em;height:1.15em;fill:currentColor;flex:none}
.bar .btn.icon{padding:.35em .5em;display:inline-flex;align-items:center;justify-content:center}
.bar .btn.icon svg{width:1.4em;height:1.4em}
.bar .btn.icon[aria-pressed=true]{background:transparent;color:var(--ink)}
/* scoreboard */
.card{background:var(--sheet);border:2px solid var(--line);border-radius:10px;overflow:hidden}
#score{background:#163A28;border-color:#0F2A1C;color:#F4EBD0}
table.line{width:100%;font-family:var(--cond);border-collapse:collapse;font-variant-numeric:tabular-nums;text-align:center}
.line th,.line td{padding:7px 3px;font-size:1.05rem;border-bottom:1px solid rgba(255,255,255,.12)}
.line thead th{font-weight:600;color:#A9C2A8;font-size:.82rem;background:#11301F}
.line tr:last-child td{border-bottom:0}
.line td.nm,.line th.nm{text-align:left;padding-left:10px;font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:1.05rem;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.line td.cur{background:#F3D23B;color:#163A28;font-weight:800}
.line td.tot{font-weight:800;border-left:2px solid rgba(255,255,255,.2);font-size:1.2rem;color:#F3D23B}
.sw{display:inline-block;width:.75em;height:.75em;border-radius:50%;margin-right:.45em;vertical-align:baseline;border:1.5px solid #fff}
.line tr.batting td.nm::after{content:" ⚾";font-size:.8em}
.line-wrap{overflow-x:auto}
/* field */
.fieldbox{position:relative;line-height:0}
#field{width:100%;height:auto;display:block}
.runner{transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.5,1);transform-origin:center;transform-box:fill-box}
.runner.off{opacity:0;transform:scale(.3)}
.hud{position:absolute;left:8px;top:8px;line-height:1.15;background:rgba(10,24,16,.72);padding:5px 10px 6px;border-radius:8px;font-family:var(--cond);font-stretch:condensed;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.hud b{font-size:1.25rem;display:block}
.hud span{font-size:.95rem}
.outs{position:absolute;right:8px;top:8px;background:rgba(10,24,16,.72);padding:7px 9px;border-radius:8px;display:flex;gap:6px;align-items:center;line-height:1;color:#fff;font-family:var(--cond);font-size:.95rem;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.outs i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:inline-block;transition:background .2s}
.outs i.on{background:#E5382B;border-color:#fff}
/* at-bat panel */
.panel{padding:12px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.who{font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:1.6rem;line-height:1}
.status{margin:0;color:var(--muted);min-height:1.3em}
.dicebox{position:relative}
.dice{display:flex;gap:18px;justify-content:center;padding:6px 0}
.dicewrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.dlabel{font-family:var(--cond);font-size:.85rem;color:var(--muted);min-height:1.1em}
.die{width:64px;height:64px;background:#fff;border:2px solid var(--line);border-radius:12px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9%;position:relative;will-change:transform}
.die i{background:#13243D;border-radius:50%;margin:14%}
.die.tossing{z-index:6}
.result{min-height:4.3em;display:flex;flex-direction:column;align-items:center;justify-content:center}
.result b{font-family:var(--cond);font-stretch:condensed;font-size:2rem;line-height:1.05}
.result span{color:var(--muted);font-size:.98rem}
.result.good b{color:var(--good)} .result.bad b{color:var(--bad)} .result.battle b{color:var(--home)}
.result.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
#rollbtn{font-size:1.35rem;padding:.7em 1.6em;min-width:12em}
.chartbox{padding:8px 8px 10px}
.chartbox[hidden]{display:none}
.chartbox h2{white-space:nowrap;font-family:var(--cond);font-stretch:condensed;font-size:1.05rem;margin:0 0 2px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chartbox h2 small{font-family:system-ui,sans-serif;font-weight:400;font-size:.72rem;color:var(--muted)}
.cgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-template-columns:repeat(3,1fr);gap:4px 6px}
.cc{display:flex;align-items:center;gap:6px;padding:3px 5px;border-radius:7px;border:1.5px solid transparent;background:var(--paper);min-width:0}
.cc .nm{font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:.9rem;line-height:1.05}
.cc.good .nm{color:var(--good)} .cc.bad .nm{color:var(--bad)}
.cc.now{border-color:var(--ink);background:#F3D23B;box-shadow:0 0 0 2px #F3D23B}
.cc.now .nm{color:#163A28}
.dd2{display:flex;gap:3px;flex:none}
.mdie{width:21px;height:21px;background:#fff;border:1.5px solid #13243D;border-radius:5px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:2px}
.mdie i{background:#13243D;border-radius:50%;margin:0;place-self:center;width:75%;height:75%}
.log{max-height:11em;overflow:auto;padding:8px 12px;font-size:.9rem;line-height:1.45}
.log div{border-bottom:1px solid var(--line-soft);padding:2px 0}
.log[hidden]{display:none}
/* dialogs */
dialog{border:2px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:0;width:min(520px,calc(100vw - 20px));max-height:calc(100dvh - 20px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,20,12,.6)}
dialog[open]{animation:pop .16s ease-out}
.mb{padding:20px 22px 22px;overflow:auto;max-height:calc(100dvh - 24px)}
dialog h2{font-family:var(--cond);font-stretch:condensed;font-size:1.8rem;margin:0 0 .3em;line-height:1;padding-right:30px}
dialog h3{font-family:var(--cond);font-size:1.1rem;margin:1.1em 0 .4em;color:var(--line)}
dialog p{line-height:1.5;margin:.4em 0}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{font-size:.88rem;color:var(--muted)}
.xbtn{position:absolute;top:8px;right:8px;width:36px;height:36px;border:1.5px solid var(--line);background:var(--sheet);color:var(--line);font-size:24px;line-height:1;border-radius:6px;cursor:pointer;padding:0}
.field-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin:10px 0}
.field-row label{display:flex;flex-direction:column;gap:4px;font-family:var(--cond);font-weight:600}
input[type=text],select{font:inherit;padding:.55em .7em;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
.seg{display:flex;gap:6px}
.chart{width:100%;border-collapse:collapse;font-size:.95rem}
.chart td,.chart th{padding:4px 6px;border-bottom:1px solid var(--line-soft);text-align:left}
.chart td.g{color:var(--good);font-weight:700} .chart td.b{color:var(--bad);font-weight:700}
.chart .pp{display:inline-flex;gap:4px}
.chart .mini{display:inline-block;width:1.5em;height:1.5em;line-height:1.4em;text-align:center;border:1.5px solid var(--ink);border-radius:4px;font-weight:700;font-size:.85rem}
#whatsnew .rel{border-top:1px solid var(--line-soft);padding-top:4px;margin-top:14px}
#whatsnew .rel:first-of-type{border-top:0}
#whatsnew ul{margin:.3em 0;padding-left:1.2em} #whatsnew li{margin:.3em 0;line-height:1.45}
#whatsnew .rel .meta{font-size:.85rem;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#13243D;color:#fff;padding:.6em 1em;border-radius:999px;z-index:3000;font-weight:600;max-width:calc(100vw - 24px);text-align:center}
.motion-off *{animation:none!important;transition:none!important}
/* immersive 3D throw */
#throw{position:fixed;inset:0;z-index:2000;pointer-events:none;background:rgba(5,20,12,.45);overflow:hidden}
#throw.armed{pointer-events:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.tdie{position:absolute;left:0;top:0;perspective:700px;will-change:transform}
.tdie .cube{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.tdie .face{position:absolute;inset:0;box-sizing:border-box;background:#fff;border:1.5px solid #B9C6D2;border-radius:12%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 0 14px rgba(19,36,61,.22)}
.tdie .face i{width:76%;height:76%;border-radius:50%;background:#13243D;place-self:center}
.tshadow{position:absolute;left:10%;top:10%;width:80%;height:80%;border-radius:20%;background:#000;filter:blur(9px)}
.throw-tip{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);top:calc(64px + env(safe-area-inset-top));margin:0;padding:8px 14px;border-radius:999px;background:#13243D;text-align:center;color:#fff;font-weight:600;font-size:1rem;pointer-events:none}
.throw-cancel,#throw .throw-cancel{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;background:#fff;color:#13243D;border-color:#fff}
.burst{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;pointer-events:none;z-index:5;overflow:visible}
.burst line{stroke:var(--home);stroke-width:4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.fxrun{font:700 9px Arial,sans-serif;fill:#F3D23B;stroke:#123623;stroke-width:2.2px;paint-order:stroke;text-anchor:middle}
#field.snap .runner{transition:none}
.result span.pbp{color:var(--ink);font-size:1rem;display:block;margin-bottom:2px}
.fxstage{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4;line-height:1}
.stamp{position:absolute;left:50%;top:46%;font-family:var(--cond);font-stretch:condensed;font-weight:900;font-size:clamp(2.2rem,13vw,4.2rem);color:#fff;-webkit-text-stroke:2px #123623;text-shadow:0 4px 0 #123623,0 8px 18px rgba(0,0,0,.5);white-space:nowrap;letter-spacing:.02em;line-height:1}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;margin:-2.5px 0 0 -2.5px}
.rocket{position:absolute;width:3px;height:12px;margin-left:-1.5px;border-radius:2px;background:linear-gradient(#fff,rgba(243,210,59,0))}
.fxlayer{position:absolute;inset:0}
.dimmer{background:rgba(5,15,10,.6)} .flashw{background:#fff}
.glow{background:radial-gradient(circle at 50% 86%,rgba(243,210,59,.85),rgba(243,210,59,0) 72%)}
.mob{position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;margin:-10px 0 0 -10px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.replay{position:absolute;right:8px;bottom:8px;background:#C8402B;color:#fff;font:700 .8rem var(--cond);padding:4px 8px;border-radius:4px;letter-spacing:.12em}
.bolt{position:absolute;left:50%;top:0;width:60%;height:100%;transform:translateX(-50%)}
.outs i.flash{animation:outflash .45s 2}
.outs i.third{animation:outflash .35s 3;box-shadow:0 0 10px 3px rgba(229,56,43,.8)}
@keyframes outflash{50%{transform:scale(1.55);box-shadow:0 0 0 5px rgba(229,56,43,.45)}}
.line td.bump{animation:bump .9s}
@keyframes bump{0%,40%{background:#F3D23B;color:#163A28}}
.line td.lit{animation:lit .9s}
@keyframes lit{0%{background:#fff}}
.line tr.winrow td{animation:winflood 1.4s forwards}
@keyframes winflood{to{background:rgba(243,210,59,.22)}}
.dice.versus{gap:8px}
.vs{font-family:var(--cond);font-weight:900;font-size:1.4rem;color:var(--home);align-self:center;margin-top:-1.1em}
.dice.intro .dicewrap:first-child{animation:slideL .55s cubic-bezier(.3,1.5,.5,1)}
.dice.intro .dicewrap:last-child{animation:slideR .55s cubic-bezier(.3,1.5,.5,1)}
.dice.intro .vs{animation:pop .4s .25s both}
@keyframes slideL{from{transform:translateX(-90px);opacity:0}} @keyframes slideR{from{transform:translateX(90px);opacity:0}}
.die.win{box-shadow:0 0 0 4px #F3D23B,0 0 18px 6px rgba(243,210,59,.7);border-color:#B88B00;transition:box-shadow .3s}
.die.lose{opacity:.35;filter:grayscale(1);transform:rotate(-10deg) scale(.88);transition:all .4s}
#sides{text-align:center;overflow:hidden}
#sides .mb{padding-top:0}
#sides .wipe{height:12px;margin:0 -22px 18px;background:var(--c);transform-origin:left;animation:wipe .7s ease-out}
@keyframes wipe{from{transform:scaleX(0)}}
#sides .eyebrow{font-family:var(--cond);font-weight:800;color:var(--bad);letter-spacing:.14em;text-transform:uppercase;margin:0}
#sides h2{padding:0;font-size:2.5rem;margin:.1em 0 .25em}
#sides .tok{display:inline-block;width:48px;height:48px;border-radius:50%;background:var(--c);border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);animation:tokin .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes tokin{from{transform:translateX(-140px) scale(.4);opacity:0}}
#sides .sc{font-family:var(--cond);font-size:1.3rem;font-weight:700;margin:.5em 0 .2em}
#sides .row-btns{justify-content:center}
#sides-go{font-size:1.25rem;min-width:10em}
.confetti{position:fixed;z-index:2500;pointer-events:none;border-radius:2px}
</style>
</head>
<body>
<main id="app" hidden>
  <div class="bar">
    <h1>Diceball</h1>
    <button class="btn small" id="undo" aria-label="Undo last roll" title="Undo (U)">↶ Undo</button>
    <button class="btn small" id="fs" aria-label="Full screen" title="Full screen">⛶</button>
    <button class="btn small icon" id="snd" aria-label="Sound is on. Turn sound off" title="Sound is on" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="snd-icon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
    <button class="btn small icon" id="gear" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
  </div>
  <section class="card line-wrap" id="score" aria-label="Scoreboard"></section>
  <section class="card fieldbox" aria-label="Field">
    <svg id="field" viewBox="0 0 240 200" role="img" aria-label="Baseball field">
      <defs>
        <pattern id="crowd" width="9" height="6" patternUnits="userSpaceOnUse"><rect width="9" height="6" fill="#26352D"/><rect y="5" width="9" height="1" fill="#1A251F"/><circle cx="2" cy="3" r="1.1" fill="#8F8273"/><circle cx="6.5" cy="2.6" r="1.1" fill="#5E4A3D"/></pattern>
        <pattern id="mow" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45 120 180)"><rect width="16" height="16" fill="#3C8C52"/><rect width="8" height="8" fill="#48A061"/><rect x="8" y="8" width="8" height="8" fill="#48A061"/></pattern>
        <radialGradient id="dirt"><stop offset="0" stop-color="#D6A870"/><stop offset="1" stop-color="#B9844F"/></radialGradient>
        <clipPath id="fair"><path d="M120,180 L0,60 L0,0 L240,0 L240,60 Z"/></clipPath>
        <clipPath id="park"><path d="M0,67 A165,165 0 0 1 240,67 L240,200 L0,200 Z"/></clipPath>
        <filter id="tokshadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-opacity=".5"/></filter>
      </defs>
      <rect width="240" height="200" fill="url(#crowd)"/>
      <path d="M0,67 A165,165 0 0 1 240,67 L240,200 L0,200 Z" fill="url(#mow)"/>
      <path d="M0,67 A165,165 0 0 1 240,67" fill="none" stroke="#B9844F" stroke-width="15" clip-path="url(#park)"/>
      <path d="M0,67 A165,165 0 0 1 240,67" fill="none" stroke="#123623" stroke-width="3.2"/>
      <path d="M0,68.6 A165,165 0 0 1 240,68.6" fill="none" stroke="#F3D23B" stroke-width=".7"/>
      <g fill="#fff" opacity=".85" font-family="Arial,sans-serif" font-weight="700" font-size="6" text-anchor="middle"><text x="120" y="32">400</text><text x="40" y="61">375</text><text x="200" y="61">375</text></g>

/* =====================================================================
   ENGINE: the rules, with no screen code. Tests drive these directly.
   ===================================================================== */
const OUTCOMES = {
  HR :{label:'Home Run',     kind:'hit',  good:true},
  '3B':{label:'Triple',      kind:'hit',  good:true},
  '2B':{label:'Double',      kind:'hit',  good:true},
  '1B':{label:'Single',      kind:'hit',  good:true},
  BB :{label:'Walk',         kind:'walk', good:true},
  HBP:{label:'Hit By Pitch', kind:'walk', good:true},
  FO :{label:'Fly Out',      kind:'out', outs:1},
  PO :{label:'Pop Out',      kind:'out', outs:1},
  GO :{label:'Ground Out',   kind:'out', outs:1},
  K  :{label:'Strike Out',   kind:'out', outs:1},
  DP :{label:'Double Play',  kind:'out', outs:2},
  TP :{label:'Triple Play',  kind:'out', outs:3},
};
/* The dice chart: every unordered pair of two dice. Doubles come up 1 time in 36, other pairs 2 in 36. */
const CHART = {
  '1-1':'HR','1-2':'2B','1-3':'FO','1-4':'BB','1-5':'PO','1-6':'1B',
  '2-2':'DP','2-3':'GO','2-4':'K','2-5':'1B','2-6':'K',
  '3-3':'TP','3-4':'3B','3-5':'HBP','3-6':'FO',
  '4-4':'BB','4-5':'PO','4-6':'K',
  '5-5':'1B','5-6':'2B','6-6':'HR',
};
/* Doubles with a good result for the batter go to a Battle. */
const BATTLE_KEYS = ['1-1','4-4','5-5','6-6'];
const ROBBED = {HR:'Robbed Home Run', '1B':'Robbed Single', BB:'Struck out looking'};
const ordinal = n => { const v = n%100, x = ['th','st','nd','rd']; return n+(x[(v-20)%10]||x[v]||x[0]); };
const keyOf = d => d[0]<=d[1] ? d[0]+'-'+d[1] : d[1]+'-'+d[0];
const roll1 = rng => 1+Math.floor(rng()*6);
const roll2 = rng => [roll1(rng), roll1(rng)];

function newGame(o={}){
  const t = o.teams || [{name:'Visitors', bot:false},{name:'Home', bot:false}];
  return {v:1, teams:t.map(x=>({name:String(x.name||'Team').slice(0,20), bot:!!x.bot})),
    innings:o.innings||9, inning:1, half:0, outs:0, bases:[0,0,0], runs:[[],[]], hits:[0,0],
    pending:null, over:false, winner:null, walkoff:false, homeSkipped:false, dice:[1,1], log:[]};
}
const teamRuns = (s,t) => s.runs[t].reduce((a,b)=>a+(b||0),0);
const keyLabel = key => OUTCOMES[CHART[key]].label;

function logLine(s, text){ s.log.push(text); if(s.log.length>300) s.log.shift(); }
const halfTag = s => (s.half===0?'▲':'▼')+s.inning;

function addRuns(s, n){
  if(!n) return;
  s.runs[s.half][s.inning-1] = (s.runs[s.half][s.inning-1]||0) + n;
}
function finish(s, winner, why){
  s.over = true; s.winner = winner; s.pending = null; s.outs = Math.min(s.outs,3);
  logLine(s, `Final: ${s.teams[0].name} ${teamRuns(s,0)}, ${s.teams[1].name} ${teamRuns(s,1)}.`);
  if(why) s.walkoff = why==='walkoff';
}
/* Three outs: clear the bases, then decide whether the game is over or the sides switch. */
function endHalf(s){
  s.outs = 0; s.bases = [0,0,0];
  const a = teamRuns(s,0), b = teamRuns(s,1);
  if(s.half===0){
    if(s.inning>=s.innings && b>a){ s.homeSkipped = true; finish(s, 1); return 'over'; }
    s.half = 1;
  } else {
    if(s.inning>=s.innings && a!==b){ finish(s, a>b?0:1); return 'over'; }
    s.inning++; s.half = 0;
  }
  return 'switch';
}
/* Apply one outcome for the team at bat. Returns what happened, for the screen to show. */
function applyOutcome(s, id, robbed){
  const o = OUTCOMES[id], t = s.half, b = s.bases, name = s.teams[t].name, tag = halfTag(s);
  let runs = 0, outs = o.outs||0, n = [b[0],b[1],b[2]];
  const on = b[0]+b[1]+b[2];
  const mv = [];
  if(id==='HR'){ runs = on+1; n = [0,0,0]; }
  else if(id==='3B'){ runs = on; n = [0,0,1]; }
  else if(id==='2B'){ runs = b[1]+b[2]; n = [0,1,b[0]]; }
  else if(id==='1B'){ runs = b[2]; n = [1,b[0],b[1]]; }
  else if(o.kind==='walk'){
    if(b[0]){ if(b[1]){ if(b[2]) runs = 1; n[2] = 1; } n[1] = 1; }
    n[0] = 1;
  }
  const label = robbed ? (ROBBED[id]||'Robbed!') : o.label;
  if(!robbed){
    if(id==='HR'){ [3,2,1].forEach(i=>{ if(b[i-1]) mv.push({from:i,to:4}); }); mv.push({from:0,to:4}); }
    else if(id==='3B'){ [3,2,1].forEach(i=>{ if(b[i-1]) mv.push({from:i,to:4}); }); mv.push({from:0,to:3}); }
    else if(id==='2B'){ [3,2,1].forEach(i=>{ if(b[i-1]) mv.push({from:i,to:Math.min(4,i+2)}); }); mv.push({from:0,to:2}); }
    else if(id==='1B'){ [3,2,1].forEach(i=>{ if(b[i-1]) mv.push({from:i,to:i+1}); }); mv.push({from:0,to:1}); }
    else if(o.kind==='walk'){
      if(b[0]&&b[1]&&b[2]) mv.push({from:3,to:4});
      if(b[0]&&b[1]) mv.push({from:2,to:3});
      if(b[0]) mv.push({from:1,to:2});
      mv.push({from:0,to:1});
    }
  }
  if(robbed){ outs = 1; runs = 0; n = [b[0],b[1],b[2]]; }
  s.bases = n;
  if(o.kind==='hit' && !robbed) s.hits[t]++;
  addRuns(s, runs);
  s.outs = Math.min(3, s.outs+outs);
  logLine(s, `${tag} ${name}: ${label}${runs?`, ${runs} run${runs>1?'s':''} score`:''}${outs?` (${s.outs>=3?'3':s.outs} out${s.outs===1?'':'s'})`:''}.`);
  const ev = {id, label, runs, outs, robbed:!!robbed, moves:mv, kind:robbed?'out':o.kind, halfEnded:false, over:false, walkoff:false};
  // Walk-off: the home team takes the lead in the last inning or later and the game ends at once.
  if(runs && t===1 && s.inning>=s.innings && teamRuns(s,1)>teamRuns(s,0)){
    finish(s, 1, 'walkoff'); ev.over = true; ev.walkoff = true; return ev;
  }
  if(s.outs>=3){
    ev.halfEnded = true; ev.endedTag = tag;
    const r = endHalf(s); ev.over = r==='over';
  }
  return ev;
}
/* Roll the batter's two dice. Good doubles start a Battle; everything else happens right away. */
function atBat(s, dice){
  s.dice = [dice[0],dice[1]];
  const key = keyOf(dice), id = CHART[key]; s.lastKey = key;
  if(BATTLE_KEYS.includes(key)){
    s.pending = {key, id, b:null, rounds:[]};
    logLine(s, `${halfTag(s)} ${s.teams[s.half].name}: ${dice[0]}:${dice[1]} ${OUTCOMES[id].label}... Battle!`);
    return {battle:true, id, label:OUTCOMES[id].label};
  }
  return applyOutcome(s, id, false);
}
/* Battle rounds: batter and defender each roll one die; ties roll again. */
function battleRounds(rng){
  const rounds = [];
  for(let i=0;i<200;i++){ const r = [roll1(rng), roll1(rng)]; rounds.push(r); if(r[0]!==r[1]) break; }
  return rounds;
}
function resolveBattle(s, rounds){
  const last = rounds[rounds.length-1];
  const batterWins = last[0]>last[1];
  const id = s.pending.id; s.pending = null; s.dice = [last[0], last[1]];
  const ev = applyOutcome(s, id, !batterWins);
  ev.battle = true; ev.batterWins = batterWins; ev.rounds = rounds.length;
  return ev;
}

/* =====================================================================
   SMALL HELPERS, STORAGE, STATE
   ===================================================================== */
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];
const esc = t => String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r=>setTimeout(r, ms));
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
const KEY_AUTO='dd.auto', KEY_SETUP='dd.setup', KEY_THEME='dd.theme', KEY_MOTION='dd.motion', KEY_MUTE='dd.mute',
      KEY_ROLL='dd.roll', KEY_LOG='dd.log', KEY_CHART='dd.chart', KEY_SEEN='dd.seen', KEY_RELOAD='dd.reload', KEY_RESUME='dd.resume';
const PLACES = ['Austin','Dallas','Houston','San Antonio','El Paso','Fort Worth','Lubbock','Amarillo','Waco','Galveston','Tyler','Laredo',
  'Boston','Chicago','Denver','Seattle','Phoenix','Atlanta','Miami','Detroit','Portland','Nashville','Memphis','Omaha','Oakland','Tampa','Cleveland','Brooklyn'];
const ui = {
  state:null, hist:[], busy:false, held:null, throwVel:null, result:null, labels:null, botTimer:null, installEvt:null,
  theme: LS.get(KEY_THEME)==='dark' ? 'dark' : 'light',
  motion: LS.get(KEY_MOTION)==='off' ? 'off' : 'on',

};
const rng = () => Math.random();
const reducedMotion = () => ui.motion==='off';
const teamColor = t => t===0 ? 'var(--vis)' : 'var(--home)';
const dialogOpen = () => $$('dialog').some(d=>d.open);
function autosave(){ if(ui.state) LS.set(KEY_AUTO, JSON.stringify(ui.state)); }
function validState(o){ return o && o.v===1 && Array.isArray(o.teams) && o.teams.length===2 && Array.isArray(o.runs) && Array.isArray(o.bases) && Array.isArray(o.log); }
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3200);
}
function applyTheme(){
  document.documentElement.dataset.theme = ui.theme;

/* Sound effects, synthesized with the Web Audio API */
const sfx = {
  ctx:null,
  ensure(){
    if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(this.ctx.state==='suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, o={}){
    const c = this.ensure(); if(!c || ui.muted) return;
    const t = c.currentTime + (o.when||0), osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type||'sine'; osc.frequency.setValueAtTime(freq, t);
    if(o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.gain||0.12, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.connect(g).connect(c.destination); osc.start(t); osc.stop(t+dur+0.05);
  },
  noise(dur, o={}){
    const c = this.ensure(); if(!c || ui.muted) return;
    const t = c.currentTime + (o.when||0), len = Math.max(1, Math.floor(c.sampleRate*dur));
    const buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * (1 - i/len);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type='bandpass'; f.frequency.value = o.freq||2000; f.Q.value = o.q||1;
    const g = c.createGain(); g.gain.value = o.gain||0.2;
    src.connect(f).connect(g).connect(c.destination); src.start(t);
  },
  play(name){
    if(ui.muted) return;
    switch(name){
      case 'dice': for(let k=0;k<6;k++) this.noise(0.035, {when:k*0.065+Math.random()*0.02, freq:1500+Math.random()*1500, q:3, gain:0.35}); break;
      case 'pop': this.noise(0.28, {freq:900, q:.8, gain:.4}); this.tone(1700, 0.16, {gain:.04, slide:500}); break;
      case 'crack': this.noise(0.4, {freq:2600, q:.5, gain:.55}); this.tone(70, 0.45, {gain:.25, slide:38}); break;
      case 'whoosh': this.noise(0.45, {freq:600, q:.6, gain:.3}); break;
      case 'stamp': this.tone(120, 0.14, {gain:.22, slide:55}); this.noise(.07, {freq:500, gain:.3}); break;
      case 'cheer': for(let k=0;k<10;k++) this.noise(0.7, {when:k*0.07, freq:1000+Math.random()*1800, q:.7, gain:.1}); break;
      case 'step': this.tone(940, 0.045, {type:'triangle', gain:0.05}); break;
      case 'thud': this.tone(95, 0.18, {gain:0.22, slide:48}); this.noise(0.07, {freq:300, q:1.5, gain:0.35}); break;
      case 'hit': this.noise(0.05, {freq:1200, q:4, gain:0.6}); this.tone(660, 0.12, {gain:0.1}); this.tone(990, 0.2, {when:0.08, gain:0.1}); break;
      case 'out': this.tone(300, 0.25, {type:'triangle', gain:0.1, slide:150}); break;
      case 'walk': this.tone(520, 0.1, {type:'triangle', gain:0.1}); this.tone(700, 0.16, {when:0.09, type:'triangle', gain:0.1}); break;
      case 'battle': [330,330,440].forEach((f,i)=>this.tone(f, 0.14, {when:i*0.12, type:'square', gain:0.05})); break;
      case 'fanfare': [523,659,784,1047].forEach((f,i)=>this.tone(f, 0.22, {when:i*0.1, type:'triangle', gain:0.1})); [1047,1319,1568].forEach(f=>this.tone(f, 0.9, {when:0.45, type:'triangle', gain:0.07})); this.noise(0.5, {when:0.42, freq:6000, q:0.7, gain:0.08}); break;
      case 'victory': [523,659,784,1047,1319].forEach((f,i)=>this.tone(f, 0.38, {when:i*0.13, type:'triangle', gain:0.1})); break;
    }
  },
};

const PIPS = {1:['2/2'],2:['1/1','3/3'],3:['1/1','2/2','3/3'],4:['1/1','1/3','3/1','3/3'],5:['1/1','1/3','2/2','3/1','3/3'],6:['1/1','2/1','3/1','1/3','2/3','3/3']};
const pips = v => !PIPS[v] ? '' : PIPS[v].map(a=>`<i style="grid-area:${a}"></i>`).join('');
const batTeam = () => ui.state.teams[ui.state.half];

function renderScore(){
  const s = ui.state, cols = Math.max(s.innings, s.inning);
  const head = Array.from({length:cols}, (_,i)=>`<th>${i+1}</th>`).join('');
  const row = t => {
    const cells = Array.from({length:cols}, (_,i)=>{
      const inn = i+1;
      const played = inn<s.inning || (inn===s.inning && (t<=s.half || s.over));
      const cur = !s.over && inn===s.inning && t===s.half;
      let v = played ? String(s.runs[t][i]||0) : '';
      if(t===1 && s.homeSkipped && inn===s.inning) v = 'X';
      return `<td class="${cur?'cur':''}">${v}</td>`;
    }).join('');

    for(const t of plan.throws){ await flyBall(b, at, t, 3, plan.throwMs||260); at = t; }
    b.animate([{opacity:1},{opacity:0}], {duration:200}).finished.then(()=>b.remove(), ()=>b.remove());
    return;
  }
  if(plan.glove) setTimeout(()=>glove(plan.to), plan.dur*0.55);
  await flyBall(b, home, plan.to, plan.h, plan.dur);
  if(plan.kind==='catch'){ b.animate([{opacity:1},{opacity:0}], {duration:220}).finished.then(()=>b.remove(), ()=>b.remove()); return; }
  // A hit: the fielder throws the ball back in.
  await flyBall(b, plan.to, [120,124], 6, 500);
  b.remove();
}
function newRunner(color, at){
  const g = document.createElementNS(SVGNS,'g');
  g.setAttribute('fill', color); g.setAttribute('filter','url(#tokshadow)');
  g.innerHTML = '<circle r="7" stroke="#fff" stroke-width="2"/><path d="M-4,-1 A4.5,4.5 0 0 1 4,-1 L6.5,0.5 L-4,0.5 Z" fill="#000" opacity=".35"/>';
  g.setAttribute('transform', `translate(${at[0]} ${at[1]-6})`);
  fxLayer().appendChild(g); return g;
}
async function runBases(m, color, legMs){
  const pts = m.from===0 ? [BATTER_PT, ...BASE_PT.slice(1, m.to+1)] : BASE_PT.slice(m.from, m.to+1);
  const g = newRunner(color, pts[0]);
  for(let i=1;i<pts.length;i++){
    const a = pts[i-1], c = pts[i];
    await tween(legMs, u=>{ const k = ease(u), x = a[0]+(c[0]-a[0])*k, y = a[1]+(c[1]-a[1])*k - Math.abs(Math.sin(u*Math.PI*3))*1.6;
      g.setAttribute('transform', `translate(${x} ${y-6})`); });
  }
  if(m.to===4){
    await tween(260, u=>g.setAttribute('transform', `translate(120 ${166-Math.sin(Math.PI*u)*7})`));
    sfx.play('step');
    const t = document.createElementNS(SVGNS,'text'); t.setAttribute('class','fxrun'); t.setAttribute('x','134'); t.setAttribute('y','168'); t.textContent = '+1';
    fxLayer().appendChild(t);
    t.animate([{transform:'translate(0,0)', opacity:1},{transform:'translate(0,-16px)', opacity:0}], {duration:900, easing:'ease-out'}).finished.then(()=>t.remove(), ()=>t.remove());
    await g.animate([{opacity:1},{opacity:0}], {duration:260}).finished.catch(()=>{});
    g.remove(); return null;
  }
  return g;
}
/* Play out an at-bat on the field. Returns once every runner has arrived. */
async function animatePlay(ev, before, team, plan){
  if(reducedMotion() || !ev.moves) return;
  const field = $('#field'), color = team===0 ? '#1C4E8A' : '#C8402B';
  field.classList.add('snap');
  // The runners who move are taken off their bases and run as separate tokens.
  ev.moves.forEach(m=>{ if(m.from>0) $('#r'+m.from).classList.add('off'); else $('#batter').classList.add('off'); });
  if(!ev.moves.length && plan.kind!=='none') $('#batter').classList.add('off');
  const ball = animateBall(plan);
  if(plan.kind==='hit' || plan.kind==='hr') await sleep(plan.kind==='hr' ? 500 : 250);
  const legMs = ev.id==='HR' ? 340 : ev.kind==='walk' ? 300 : 260;
  const runners = await Promise.all(ev.moves.map((m,k)=>sleep(k*60).then(()=>runBases(m, color, legMs))));
  await ball;
  await sleep(150);
  runners.forEach(g=>g && g.remove());
}

/* =====================================================================
   GAME FLOW
   ===================================================================== */
function describe(ev, plan, team){
  const parts = [];
  if(ev.battle) parts.push(ev.batterWins ? 'The batter wins the battle' : 'The defender wins the battle');
  if(ev.runs) parts.push(`${ev.runs} run${ev.runs>1?'s':''} score${ev.runs>1?'':'s'}`);
  else if(ev.kind!=='out' && !ev.battle) parts.push('No runs');
  if(ev.outs) parts.push(`${ev.outs} out${ev.outs>1?'s':''}`);
  if(ev.walkoff) parts.push('Walk-off win!');
  else if(ev.halfEnded && !ev.over) parts.push('Three outs: switching sides');
  return {title:ev.label, pbp: plan && plan.text ? `${team} ${plan.text}` : '', sub:parts.join(' · '), tone: ev.kind==='out' ? 'bad' : 'good'};
}
function sound(ev){
  if(ev.id==='HR' && !ev.robbed) sfx.play('fanfare');
  else if(ev.kind==='hit') sfx.play('hit');
  else if(ev.kind==='walk') sfx.play('walk');
  else sfx.play('out');
}
async function takeTurn(){
  const s = ui.state; if(ui.busy || s.over) return;
  ui.busy = true; ui.hist.push(JSON.stringify(s)); if(ui.hist.length>40) ui.hist.shift();
  clearBot(); renderPanel();
  if(s.pending){
    const p = s.pending, v = roll1(rng);
    if(p.b==null){
      await animateDice([v], false, 0);
      p.b = v;
      ui.result = {title:`Batter rolls a ${v}`, sub:`${s.teams[1-s.half].name}: your turn to defend.`, tone:'battle'};
      ui.busy = false; autosave(); renderAll(); scheduleBot(); return;
    }
    await animateDice([v], false, 1);
    if(v===p.b){
      p.rounds.push([p.b, v]);
      ui.result = {title:'Tie!', sub:'Both roll again.', tone:'battle'}; box('#result', ui.result); tieFx();
      await sleep(reducedMotion()?100:1000);
      p.b = null; ui.busy = false; autosave(); renderAll(); scheduleBot(); return;
    }
    ui.battleWin = p.b>v ? 0 : 1; ui.labels = ['Batter','Defender'];
    { const dd = $$('#dice .die'); if(dd.length===2){ dd[ui.battleWin].classList.add('win'); dd[1-ui.battleWin].classList.add('lose'); } }
    await sleep(reducedMotion() ? 0 : 650);
    const before = snapOf(s), team = s.half;
    const ev = resolveBattle(s, [...p.rounds, [p.b, v]]);
    await playOut(ev, before, team);
    afterPlay(ev);
  } else {
    ui.labels = null; ui.battleWin = null; ui.result = null; $('#result').innerHTML = '<span>&nbsp;</span>';
    $$('#dice .dlabel').forEach(e=>e.textContent = '');
    const dice = roll2(rng);
    await animateDice(dice, false);
    const before = snapOf(s), team = s.half;
    const ev = atBat(s, dice);
    if(ev.battle){
      ui.result = {title:'Battle!', sub:`${dice[0]}:${dice[1]} would be a ${ev.label}. The defender gets a say. Batter rolls first.`, tone:'battle'}; sfx.play('battle'); box('#result', ui.result); ui.battleIntro = true; await battleIntro();
    } else await playOut(ev, before, team);
    afterPlay(ev);
  }
}

/* Show the call, play it out on the field, then update the board. */
async function playOut(ev, before, team){
  const plan = planPlay(ev), homer = ev.id==='HR' && !ev.robbed, slam = homer && ev.runs===4;
  ui.result = describe(ev, plan, s_name(team)); box('#result', ui.result);
  sound(ev);
  if(homer){ buzz(slam ? [60,40,60,40,140] : [40,60,90]); setTimeout(()=>{ fireworks(slam ? 8 : 4, [teamHex(team), '#F3D23B', '#FFFFFF']); if(slam) shake(); }, 950); }
  if((ev.id==='K' && !ev.robbed) || (ev.robbed && ev.id==='BB')) stamp('K', {color:'#E5382B', size:'clamp(4rem,26vw,7rem)', flip:ev.robbed});
  if(ev.robbed || ev.kind!=='out') logReplace(ev, team, plan);
  await animatePlay(ev, before, team, plan);
  if(slam) await stamp('GRAND SLAM!', {color:'#F3D23B'});
  if(ev.robbed && ev.id==='HR') await stamp('ROBBED!', {color:'#E5382B'});
  if(ev.id==='TP' && !reducedMotion()){
    const tag = document.createElement('div'); tag.className = 'replay'; tag.textContent = 'REPLAY'; stage().appendChild(tag);
    await animateBall({...plan, dur:plan.dur*2.4, throwMs:700}); tag.remove();
    await stamp('TRIPLE PLAY!', {color:'#F3D23B'});
  }
  const inRuns = before.inRuns + ev.runs;
  if(ev.runs && before.inRuns<3 && inRuns>=3 && !ev.walkoff) await stamp('RALLY!', {color:'#F3D23B', ms:1100});
  ui.scored = ev.runs ? {t:team, inn:before.inning} : null;
  if(ev.outs) await flashOuts(before.outs, ev.outs);
}

  $('#setup-body').innerHTML = `<h2>New game</h2>
    <p class="hint">Two teams, one screen. The visitors bat first.</p>
    <form id="setup-form">
      ${teamRow(0,'Visitors')}${teamRow(1,'Home')}${placeList()}
      <div class="field-row"><label>Innings<select name="innings">${[3,5,7,9].map(n=>`<option value="${n}" ${cfg.innings===n?'selected':''}>${n}</option>`).join('')}</select></label>
        <button type="button" class="btn small" id="shuffle">Pick teams for me</button></div>
      <div class="row-btns"><button class="btn primary" type="submit">Play ball</button>
        <button class="btn" type="button" id="open-chart">Dice chart</button>
        ${ui.installEvt && !standalone ? '<button class="btn" type="button" id="install-btn">Install app</button>' : ''}</div>
      ${isIOS && !standalone ? '<p class="hint">To install on iPhone or iPad: tap Share, then Add to Home Screen.</p>' : ''}
    </form>`;
  const d = openDlg('#setup');
  const form = $('#setup-form', d);
  d._bots = [!!cfg.teams[0].bot, !!cfg.teams[1].bot];
  $$('[data-pt]', d).forEach(b=>b.addEventListener('click', ()=>{
    const t = +b.dataset.pt; d._bots[t] = b.dataset.bot==='1';
    $$(`[data-pt="${t}"]`, d).forEach(x=>x.setAttribute('aria-pressed', String((x.dataset.bot==='1')===d._bots[t])));
  }));
  $('#shuffle', d).addEventListener('click', ()=>{ const [a,b] = pick2(); form.name0.value = a; form.name1.value = b; });
  $('#open-chart', d).addEventListener('click', showChart);
  const ib = $('#install-btn', d); if(ib) ib.addEventListener('click', async ()=>{ const e = ui.installEvt; ui.installEvt = null; if(e){ e.prompt(); await e.userChoice.catch(()=>{}); } ib.remove(); });
  form.addEventListener('submit', e=>{
    e.preventDefault();
    const names = [form.name0.value.trim()||'Visitors', form.name1.value.trim()||'Home'];
    if(names[0].toLowerCase()===names[1].toLowerCase()) names[1] += ' 2';
    const c = {teams:[{name:names[0],bot:d._bots[0]},{name:names[1],bot:d._bots[1]}], innings:+form.innings.value};
    LS.set(KEY_SETUP, JSON.stringify(c));
    d.close(); startGame(c);
  });
}
function startGame(cfg){
  clearBot(); ui.state = newGame(cfg); ui.hist = []; ui.result = null; ui.labels = null; ui.busy = false;
  $('#app').hidden = false; autosave(); renderAll();
  logLine(ui.state, `Play ball! ${ui.state.teams[0].name} visit ${ui.state.teams[1].name}.`); renderLog();
  if(!reducedMotion()) setTimeout(()=>{ stamp('PLAY BALL!', {color:'#F3D23B', ms:1500}); sfx.play('cheer'); }, 300);
  scheduleBot();
}
function showStart(){
  let o = null; try{ o = JSON.parse(LS.get(KEY_AUTO)); }catch(e){}
  if(validState(o) && !o.over){
    $('#start-body').innerHTML = `<h2>Diceball</h2><p>A game is in progress: ${esc(o.teams[0].name)} ${teamRuns(o,0)}, ${esc(o.teams[1].name)} ${teamRuns(o,1)}, ${o.half===0?'top':'bottom'} of the ${ordinal(o.inning)}.</p>
      <div class="row-btns"><button class="btn primary" id="resume">Resume game</button><button class="btn" id="fresh">Start a new game</button></div>`;
    const d = openDlg('#start');
    $('#resume', d).addEventListener('click', ()=>{ d.close(); resumeGame(o); });
    $('#fresh', d).addEventListener('click', ()=>askConfirm('Start a new game?', 'This ends the game in progress.', 'Start new game', ()=>{ d.close(); showSetup(); }));
  } else showSetup();
}
function resumeGame(o){
  clearBot(); ui.state = o; ui.hist = []; ui.result = null; ui.labels = null; ui.busy = false;
  $('#app').hidden = false; renderAll(); if(o.over) showOver(); else scheduleBot();
}
function askConfirm(title, text, yes, fn){
  $('#confirm-body').innerHTML = `<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row-btns"><button class="btn danger" id="c-yes">${esc(yes)}</button><button class="btn" id="c-no">Cancel</button></div>`;
  const d = openDlg('#confirm');
  $('#c-no', d).addEventListener('click', ()=>d.close());
  $('#c-yes', d).addEventListener('click', ()=>{ d.close(); fn(); });
}
function showOver(){
  const s = ui.state; if(!s || !s.over || $('#over').open) return;
  clearBot(); sfx.play('victory'); confetti(s.winner===0 ? '#1C4E8A' : '#C8402B');
  const w = s.teams[s.winner].name;
  $('#over-body').innerHTML = `<h2>${esc(w)} win${s.walkoff?' it on a walk-off':''}!</h2>
    <p style="font-size:1.4rem;font-family:var(--cond);font-weight:700">${esc(s.teams[0].name)} ${teamRuns(s,0)}, ${esc(s.teams[1].name)} ${teamRuns(s,1)}</p>
    <p class="hint">Hits: ${esc(s.teams[0].name)} ${s.hits[0]}, ${esc(s.teams[1].name)} ${s.hits[1]}${s.inning>s.innings?` · ${s.inning} innings`:''}</p>
    <div class="row-btns"><button class="btn primary" id="rematch">Rematch</button><button class="btn" id="newg">New game</button><button class="btn ghost" id="closeo">View scoreboard</button></div>`;
  const d = openDlg('#over');
  $('#rematch', d).addEventListener('click', ()=>{ d.close(); startGame({teams:s.teams, innings:s.innings}); });
  $('#newg', d).addEventListener('click', ()=>{ d.close(); showSetup({teams:s.teams, innings:s.innings}); });
  $('#closeo', d).addEventListener('click', ()=>{ d.close(); renderAll(); });
}
function showChart(){
  const rows = Object.keys(CHART).map(k=>{ const o = OUTCOMES[CHART[k]], [a,b] = k.split('-'), good = o.good;
    const cnt = a===b ? 1 : 2; void b;
    return `<tr><td>${miniDice(k)}</td><td class="${good?'g':'b'}">${o.label}${BATTLE_KEYS.includes(k)?' ⚔':''}</td><td>${cnt}/36</td></tr>`; }).join('');
  $('#chart-body').innerHTML = `<h2>Dice chart</h2><p class="hint">Green helps the batter, orange helps the defense. ⚔ means a Battle: batter and defender each roll one die, higher wins, ties roll again. If the defender wins, it is an out.</p>
    <table class="chart"><thead><tr><th>Roll</th><th>Result</th><th>Odds</th></tr></thead><tbody>${rows}</tbody></table>
    <h3>Base running</h3><p class="hint">Single: runners move up 1. Double: 2. Triple: every runner scores. Home run: everyone scores. Walk or hit by pitch: runners move only if forced. Outs never move runners. A double play is 2 outs and a triple play is 3 outs.</p>`;
  openDlg('#chartdlg');
}
function showMenu(){
  const seg = (name, opts, cur) => `<div class="seg" role="group" aria-label="${name}">${opts.map(([v,l])=>`<button class="btn small" data-set="${name}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;
  $('#menu-body').innerHTML = `<h2>Menu</h2>
    <h3>Dice rolling</h3>${seg('roll', [['classic','Classic'],['immersive','Immersive']], ui.rollStyle)}
    <p class="hint">Classic: tap Roll dice and they roll right away. Immersive: tap Roll dice to pick up 3D dice, then flick or tap to throw them across the screen.</p>
    <h3>Animations</h3>${seg('motion', [['on','On'],['off','Off']], ui.motion)}
    <h3>Appearance</h3>${seg('theme', [['light','Light'],['dark','Dark']], ui.theme)}
    <h3>Dice chart on screen</h3>${seg('chart', [['1','Shown'],['0','Hidden']], ui.showChart?'1':'0')}
    <h3>Game log</h3>${seg('log', [['0','Hidden'],['1','Shown']], ui.showLog?'1':'0')}
    <div class="row-btns"><button class="btn" id="m-chart">Dice chart</button><button class="btn danger" id="m-new">New game</button></div>
    <p class="hint">Version ${esc(APP_VERSION)}. New versions install on their own. <button class="btn small ghost" id="m-wn">What’s new</button></p>`;
  const d = openDlg('#menu');
  $$('[data-set]', d).forEach(b=>b.addEventListener('click', ()=>{
    const k = b.dataset.set, v = b.dataset.v;
    if(k==='roll'){ ui.rollStyle = v==='immersive' ? 'immersive' : 'classic'; LS.set(KEY_ROLL, ui.rollStyle); }
    if(k==='motion'){ ui.motion = v==='off' ? 'off' : 'on'; LS.set(KEY_MOTION, ui.motion); applyMotion(); }
    if(k==='theme'){ ui.theme = v==='dark' ? 'dark' : 'light'; LS.set(KEY_THEME, ui.theme); applyTheme(); }
    if(k==='chart'){ ui.showChart = v==='1'; LS.set(KEY_CHART, v); renderChart(); }
    if(k==='log'){ ui.showLog = v==='1'; LS.set(KEY_LOG, v); renderLog(); }
    $$(`[data-set="${k}"]`, d).forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.v===v)));
  }));
  $('#m-chart', d).addEventListener('click', ()=>{ d.close(); showChart(); });
  $('#m-wn', d).addEventListener('click', ()=>{ d.close(); showWhatsNew(RELEASES.slice(0,3), true); });
  $('#m-new', d).addEventListener('click', ()=>{ d.close(); if(ui.state && !ui.state.over) askConfirm('Start a new game?', 'This ends the game in progress.', 'Start new game', ()=>showSetup()); else showSetup(); });
}

/* ---------- Controls ---------- */
$('#sides').addEventListener('close', ()=>{ clearTimeout(ui.sidesTimer); setTimeout(flashInning, 50); });
$('#rollbtn').addEventListener('click', onRoll);
$('#undo').addEventListener('click', undo);
$('#gear').addEventListener('click', showMenu);
$('#snd').addEventListener('click', ()=>{ ui.muted = !ui.muted; LS.set(KEY_MUTE, ui.muted?'1':'0'); renderAll(); });
$('#fs').addEventListener('click', ()=>{ try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch(e){} });
if(!document.documentElement.requestFullscreen) $('#fs').hidden = true;
$$('dialog [data-close]').forEach(b=>b.addEventListener('click', ()=>b.closest('dialog').close()));
$('#start').addEventListener('cancel', e=>e.preventDefault());
$('#setup').addEventListener('cancel', e=>{ if(!ui.state) e.preventDefault(); });
$$('dialog').forEach(d=>d.addEventListener('close', ()=>{ if(ui.state){ renderPanel(); scheduleBot(); } }));
document.addEventListener('keydown', e=>{
  if(!ui.state || e.altKey || e.metaKey || e.ctrlKey || dialogOpen() || $('#app').hidden) return;
  if(e.target.closest && e.target.closest('input,select,textarea')) return;
  const k = e.key.toLowerCase();
  if(k===' ' || k==='enter' || k==='r'){ if(document.activeElement && document.activeElement.tagName==='BUTTON' && document.activeElement.id!=='rollbtn') return; e.preventDefault(); onRoll(); }
  else if(k==='u') undo();
  else if(k==='m') showMenu();
});

/* ---------- Installable app, updates, What's new ---------- */
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); ui.installEvt = e; });
window.addEventListener('appinstalled', ()=>{ ui.installEvt = null; toast('Diceball is installed. Open it from your home screen.'); });
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(err=>console.warn('Offline mode unavailable:', err)));
}
/* The deploy step publishes version.json. When it names a version other than the one running,
   the page saves the game, reloads, and picks the game back up where it was. */
function applyUpdateWhenIdle(version){
  if(applyUpdateWhenIdle.waiting) return; applyUpdateWhenIdle.waiting = true;
  toast('A new version is available. Updating…');
  const tick = ()=>{
    if(ui.busy || ui.held || dialogOpen()){ setTimeout(tick, 1000); return; }
    clearBot(); autosave();
    LS.set(KEY_RELOAD, version);
    if(ui.state && !ui.state.over && !$('#app').hidden) LS.set(KEY_RESUME, '1');
    location.reload();
  };
  setTimeout(tick, 1800);
}
async function checkForUpdate(){
  if(!/^https?:$/.test(location.protocol) || navigator.onLine===false) return;
  try{
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const v = (await r.json()).version;
    if(typeof v!=='string' || v===APP_VERSION) return;
    if(LS.get(KEY_RELOAD)===v) return;
    applyUpdateWhenIdle(v);
  }catch(e){}
}
setTimeout(checkForUpdate, 3000);
setInterval(checkForUpdate, 5*60*1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkForUpdate(); });
window.addEventListener('online', checkForUpdate);
function showWhatsNew(list, manual){
  const when = d => new Date(d+'T12:00:00').toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
  $('#wn-body').innerHTML = `<h2 id="wn-title">What’s new</h2>
    <p>${manual ? `You’re on version ${esc(APP_VERSION)}.` : `Diceball is now on version ${esc(APP_VERSION)}.${ui.state && !ui.state.over ? ' Your game is right where you left it.' : ''}`}</p>
    ${list.map(r=>`<section class="rel"><h3>${esc(r.title)}</h3><p class="meta">Version ${esc(r.version)}${r.date ? ', '+when(r.date) : ''}</p><ul>${r.changes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></section>`).join('')}
    <div class="row-btns"><button class="btn primary" id="wn-close" autofocus>Got it</button></div>`;
  const dlg = $('#whatsnew'); if(!dlg.open) dlg.showModal();
  $('#wn-close', dlg).addEventListener('click', ()=>dlg.close());
  $('#wn-body').scrollTop = 0;
}
$('#whatsnew').addEventListener('close', ()=>{ LS.set(KEY_SEEN, APP_VERSION); });
function maybeShowWhatsNew(){
  let seen = LS.get(KEY_SEEN);
  if(!seen){ LS.set(KEY_SEEN, APP_VERSION); return false; }   // a first-time player has nothing to catch up on
  if(seen===APP_VERSION) return false;
  const i = RELEASES.findIndex(r=>r.version===seen);
  showWhatsNew(i<0 ? RELEASES.slice(0,1) : RELEASES.slice(0,i), false);
  return true;
}

/* ---------- Start ---------- */
window.__dd = {ui, engine:{OUTCOMES, CHART, BATTLE_KEYS, newGame, atBat, applyOutcome, battleRounds, resolveBattle, endHalf, teamRuns, keyOf, roll2},
  startGame, takeTurn, undo, get state(){ return ui.state; }, APP_VERSION, RELEASES};
applyMotion(); applyTheme();
if(LS.get(KEY_RESUME)==='1'){
  LS.del(KEY_RESUME);
  let o = null; try{ o = JSON.parse(LS.get(KEY_AUTO)); }catch(e){}
  if(validState(o) && !o.over) resumeGame(o); else showStart();
} else showStart();
maybeShowWhatsNew();
</script>
